<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="City of Dreams logo">
  <defs>
    <!-- Mumbai sunset sky; userSpaceOnUse so the arches can reuse it and look "cut out" -->
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="48">
      <stop offset="0" stop-color="#a58bf0"/>
      <stop offset="0.5" stop-color="#ff7a5c"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="sun" cx="32" cy="38" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="badge">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <!-- sky + setting sun -->
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="32" cy="38" r="12" fill="url(#sun)"/>

    <!-- Gateway of India silhouette -->
    <g fill="#0b0a1a">
      <!-- turrets with domes -->
      <rect x="20.5" y="16" width="6" height="12"/>
      <rect x="37.5" y="16" width="6" height="12"/>
      <path d="M20.5 16.5 Q23.5 9.5 26.5 16.5 Z"/>
      <path d="M37.5 16.5 Q40.5 9.5 43.5 16.5 Z"/>
      <rect x="23" y="8" width="1" height="5.5"/>
      <rect x="40" y="8" width="1" height="5.5"/>
      <!-- central attic -->
      <rect x="26" y="20" width="12" height="8"/>
      <!-- main body and cornice -->
      <rect x="11" y="27" width="42" height="2.2"/>
      <rect x="13" y="29" width="38" height="18"/>
    </g>

    <!-- arches: filled with the sky so the sun glows through the big one -->
    <path d="M27.5 47 V36.5 A4.5 4.5 0 0 1 36.5 36.5 V47 Z" fill="url(#sky)"/>
    <path d="M27.5 47 V36.5 A4.5 4.5 0 0 1 36.5 36.5 V47 Z" fill="url(#sun)"/>
    <path d="M16 47 V39 A2.5 2.5 0 0 1 21 39 V47 Z" fill="url(#sky)"/>
    <path d="M43 47 V39 A2.5 2.5 0 0 1 48 39 V47 Z" fill="url(#sky)"/>

    <!-- Arabian Sea -->
    <rect y="47" width="64" height="17" fill="#0b0a1a"/>
    <path d="M8 52.5 q3 -1.6 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0" fill="none" stroke="#f6a623" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M16 57.5 q3 -1.4 6 0 t6 0 t6 0 t6 0 t6 0" fill="none" stroke="#f6a623" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
